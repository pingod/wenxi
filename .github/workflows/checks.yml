name: Source checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    # The fork has no Windows or macOS builds; upstream keeps its Windows
    # runner for the Windows-only checks below.
    runs-on: ${{ github.repository == 'pingod/wenxi' && 'ubuntu-24.04' || 'windows-2022' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
      GOPROXY: https://proxy.golang.org,direct
      GOTOOLCHAIN: go1.24.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            libayatana-appindicator3-dev libsecret-1-dev libmpv-dev xvfb
      - name: Check staged source, versions and release tools
        run: |
          python tool/check_public_files.py --staged
          dart tool/sync_version.dart --check
          python -m unittest discover -s tool/tests -p 'test_*.py'
      - name: Resolve locked packages
        run: flutter pub get --enforce-lockfile
      - name: Check build configuration handling
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tool/tests/build-config.test.ps1
      - name: Analyze Flutter
        run: flutter analyze --no-pub
      - name: Test Windows GPU preference and restoration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S windows/runner/tests -B .local/gpu-preference-tests -A x64
          if ($LASTEXITCODE -ne 0) { throw 'GPU preference test configuration failed.' }
          cmake --build .local/gpu-preference-tests --config Release --target gpu_preference_test
          if ($LASTEXITCODE -ne 0) { throw 'GPU preference test build failed.' }
          ctest --test-dir .local/gpu-preference-tests -C Release -R '^gpu_preference$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'GPU preference tests failed.' }
      - name: Build the native helper used by integration tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tool/build-native-windows.ps1
      - name: Build the Linux helper used by integration tests
        if: runner.os == 'Linux'
        run: ./tool/build-native-linux.sh
      - name: Test Flutter
        if: runner.os == 'Windows'
        run: flutter test --no-pub --concurrency=4 --reporter expanded
      - name: Test Flutter on Linux
        if: runner.os == 'Linux'
        # The full matrix's goldens and real libmpv playback are authored on
        # Windows; Linux runs the same platform suite as the CI build job.
        run: |
          flutter test --no-pub --concurrency=4 --reporter expanded \
            test/native_integration_test.dart \
            test/download_destination_native_test.dart \
            test/linux_actions_test.dart \
            test/linux_external_player_test.dart
      - name: Verify packaged Windows PGS and text subtitle decoding
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tool/prepare-player-test.ps1
          flutter test --no-pub test/native_subtitle_render_test.dart --reporter expanded
          if ($LASTEXITCODE -ne 0) { throw 'Windows native subtitle regression failed.' }
      - name: Test browser scripts and configuration editor
        run: |
          flutter test --no-pub tool/login_web_scripts_test.dart --reporter expanded
          node --test tool/remote-control-editor.test.cjs
      - name: Test the native download core
        working-directory: native/gopeed
        env:
          CGO_ENABLED: '0'
        run: go test -p=1 -mod=vendor -tags nosqlite -ldflags=-checklinkname=0 ./bind/asterlink ./internal/protocol/http ./internal/btpolicy -count=1 -timeout=600s
