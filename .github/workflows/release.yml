name: Build signed release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check version and release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            dart tool/sync_version.dart --check --tag "$RELEASE_TAG"
          else
            dart tool/sync_version.dart --check
          fi
  checks:
    needs: tag
    uses: ./.github/workflows/checks.yml
  package:
    needs: [tag, checks]
    # Only the upstream repository has the release environment and signing
    # secrets for Android, Windows and macOS. Forks publish the Linux job below
    # and reuse these upstream installers.
    if: ${{ github.repository == 'z7786/wenxi' }}
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: read
      actions: write
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: android, runner: windows-2022 }
          - { target: windows, runner: windows-2022 }
          - { target: windows-arm64, runner: windows-2022 }
          - { target: macos, runner: macos-15 }
    env:
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
      GOPROXY: https://proxy.golang.org,direct
      GOTOOLCHAIN: go1.24.7
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
      ASTERLINK_CONTROL_URL: ${{ secrets.ASTERLINK_CONTROL_URL || vars.ASTERLINK_CONTROL_URL }}
      ASTERLINK_GITHUB_REPO: ${{ vars.ASTERLINK_GITHUB_REPO || github.repository }}
      ASTERLINK_APPLICATION_ID: ${{ vars.ASTERLINK_APPLICATION_ID }}
      UMENG_APPKEY: ${{ secrets.UMENG_APPKEY || vars.UMENG_APPKEY }}
      UMENG_CHANNEL: ${{ vars.UMENG_CHANNEL || 'github' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          android: ${{ matrix.target == 'android' && 'true' || 'false' }}
          windows-arm64: ${{ matrix.target == 'windows-arm64' && 'true' || 'false' }}
      - name: Prepare pinned Windows ARM64 SDK
        if: matrix.target == 'windows-arm64'
        run: ./tool/prepare-ci-windows-arm64.ps1
      - name: Require official release configuration
        run: |
          if ($env:ASTERLINK_APPLICATION_ID -ne 'com.asterlink.app' -or
              -not $env:ASTERLINK_CONTROL_URL -or -not $env:UMENG_APPKEY) {
            throw 'Configure the original application ID, control URL and statistics key in the release environment.'
          }
      - name: Prepare Android signing files
        if: matrix.target == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ASTERLINK_CLIENT_DEFINES_JSON: ${{ secrets.ASTERLINK_CLIENT_DEFINES_JSON }}
        run: python tool/prepare-ci-release.py --android
      - name: Prepare Windows release settings
        if: matrix.target == 'windows' || matrix.target == 'windows-arm64'
        env:
          ASTERLINK_CLIENT_DEFINES_JSON: ${{ secrets.ASTERLINK_CLIENT_DEFINES_JSON }}
        run: python tool/prepare-ci-release.py
      - name: Build, test and inspect Android
        if: matrix.target == 'android'
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK installation failed.' }
          ./tool/build-android.ps1
          $settings = Get-Content -LiteralPath .local/build-config.json -Raw | ConvertFrom-Json
          python tool/verify_apk.py --apk build/app/outputs/flutter-apk/app-release.apk --sdk $env:ANDROID_HOME --application-id $settings.applicationId --umeng-channel $settings.metricsChannel --output .local/release-apk-inspection.json
          if ($LASTEXITCODE -ne 0) { throw 'APK inspection failed.' }
      - name: Test Android release code and stage APK
        if: matrix.target == 'android'
        run: |
          $settings = Get-Content -LiteralPath .local/build-config.json -Raw | ConvertFrom-Json
          $env:ORG_GRADLE_PROJECT_ASTERLINK_UNSIGNED = 'false'
          $env:ORG_GRADLE_PROJECT_ASTERLINK_APPLICATION_ID = $settings.applicationId
          $env:ORG_GRADLE_PROJECT_UMENG_APPKEY = $settings.metricsAppKey
          $env:ORG_GRADLE_PROJECT_UMENG_CHANNEL = $settings.metricsChannel
          $env:GRADLE_USER_HOME = Join-Path $env:GITHUB_WORKSPACE '.local/gradle-home'
          & ./android/gradlew.bat -p android :app:testReleaseUnitTest -Ptarget-platform=android-arm64 --no-daemon
          if ($LASTEXITCODE -ne 0) { throw 'Android unit tests failed.' }
          python tool/package-release.py --platform android
      - name: Build Windows portable package and installer
        if: matrix.target == 'windows' || matrix.target == 'windows-arm64'
        run: |
          $architecture = if ('${{ matrix.target }}' -eq 'windows-arm64') { 'arm64' } else { 'x64' }
          ./tool/build-windows.ps1 -Architecture $architecture
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          if ((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Inno Setup checksum mismatch.' }
          $inno = Join-Path $env:RUNNER_TEMP 'inno-6.7.3'
          $install = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', ('/DIR="' + $inno + '"')) -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { throw 'Inno Setup installation failed.' }
          ./tool/build-windows-installer.ps1 -Architecture $architecture -Iscc (Join-Path $inno 'ISCC.exe') -OutputDir .local/release-installer
          $installers = @(Get-ChildItem -LiteralPath .local/release-installer -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected one installer.' }
          python tool/package-release.py --platform windows --architecture $architecture --installer $installers[0].FullName
      - name: Test account and playback compatibility with the ARM64 SDK
        if: matrix.target == 'windows-arm64'
        run: flutter test --no-pub --concurrency=4 test/account_cookie_test.dart test/account_identity_test.dart test/floating_playback_test.dart test/playback_features_test.dart test/download_playback_test.dart
      - name: Build, sign and stage macOS app bundle
        if: matrix.target == 'macos'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [[ -n "${MACOS_CERTIFICATE_P12_BASE64:-}" ]]; then
            keychain="$RUNNER_TEMP/signing.keychain-db"
            echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            export CODESIGN_IDENTITY="$MACOS_CODESIGN_IDENTITY"
          fi
          ./tool/build-macos.sh --build-config config/build.community.json
          python3 tool/package-release.py --platform macos
          shasum -a 256 .local/release-assets/*.zip | tee .local/release-assets/SHA256SUMS-macos.txt
      - name: Save only release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.target }}
          path: |
            .local/release-assets/*.apk
            .local/release-assets/*.exe
            .local/release-assets/*.zip
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove temporary signing files
        if: always() && matrix.target == 'android'
        run: |
          foreach ($path in @('.local/ci-release.jks', '.local/keystore.properties')) {
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
          }
      - name: Remove temporary macOS signing files
        if: always() && matrix.target == 'macos'
        run: |
          rm -f "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
  linux:
    needs: [tag, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            libayatana-appindicator3-dev libsecret-1-dev libmpv-dev \
            squashfs-tools zstd
      - uses: ./.github/actions/setup
      - name: Fetch the pinned AppImage runtime
        run: |
          runtime=.local/appimage/runtime-x86_64
          mkdir -p .local/appimage
          curl -fsSL -o "$runtime" \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $runtime" \
            | sha256sum --check -
      - name: Build, test and package Linux
        run: |
          ./tool/build-linux.sh --build-config config/build.community.json
          python3 tool/package-linux.py \
            --format deb --format arch --format appimage \
            --appimage-runtime .local/appimage/runtime-x86_64 \
            --output-dir .local/release-assets
          python3 tool/package-release.py --platform linux
          cd .local/release-assets
          sha256sum ./*.AppImage ./*.deb ./*.pkg.tar.zst ./*.tar.gz \
            | tee SHA256SUMS-linux.txt
      - name: Verify the AppImage and smoke-test it without FUSE
        run: |
          appimage="$PWD/$(ls .local/release-assets/*.AppImage)"
          "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/asterlink
          test -x squashfs-root/usr/bin/asterlink_gopeed
          test -f squashfs-root/usr/bin/data/icudtl.dat
          grep -q '^Exec=asterlink %U$' squashfs-root/asterlink.desktop
          rm -rf squashfs-root
          set +e
          timeout 90 dbus-run-session -- bash -c "
            printf '\n' | gnome-keyring-daemon --unlock --components=secrets >/dev/null 2>&1
            exec xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' \
              timeout 25 env APPIMAGE_EXTRACT_AND_RUN=1 '$appimage'
          "
          status=$?
          set -e
          if [[ "$status" -ne 124 ]]; then
            echo "unexpected AppImage exit status $status"
            exit 1
          fi
          log="$(find "$HOME/.local/share/com.asterlink.asterlink" -name 'app-*.jsonl' | head -1)"
          test -n "$log"
          grep -q '"os":"linux"' "$log"
      - name: Save Linux release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-linux
          path: |
            .local/release-assets/*.AppImage
            .local/release-assets/*.deb
            .local/release-assets/*.pkg.tar.*
            .local/release-assets/*.tar.gz
            .local/release-assets/SHA256SUMS-linux.txt
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
